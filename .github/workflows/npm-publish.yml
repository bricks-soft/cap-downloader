# Publishes the package to the npm registry when a GitHub release is created.
# Authentication uses npm trusted publishing (OpenID Connect), configured on
# npmjs.com against this repository and this workflow file name. There is no
# npm token: the `id-token: write` permission below lets the runner exchange a
# short-lived OIDC token with the registry, and npm attaches a provenance
# statement automatically.
# https://docs.npmjs.com/trusted-publishers

name: npm package

on:
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
